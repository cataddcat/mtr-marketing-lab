name = "mtr-marketing-lab-proxy"
main = "src/index.ts"
compatibility_date = "2025-11-01"

# Secrets (DO NOT commit values; use `wrangler secret put`):
#   npx wrangler secret put GROQ_API_KEY        # required — primary
#   npx wrangler secret put SAMBANOVA_API_KEY   # required — first fallback
#   npx wrangler secret put TOGETHER_API_KEY    # optional — paid last-resort
#
# Provider pool order (free first, paid last) is defined in src/index.ts
# PROVIDER_POOL. Skip TOGETHER_API_KEY entirely and the worker still works;
# add it when the free providers' TPD limits become a regular problem.
#
# Optional non-secret vars (uncomment to restrict CORS):
# [vars]
# ALLOWED_ORIGIN = "https://your-frontend.example.com"

# KV namespaces — create once with:
#   npx wrangler kv:namespace create TRENDS_KV
#   npx wrangler kv:namespace create JUDGE_KV
# then paste each returned `id` below.
# Caching is optional: bindings can be absent and the worker still functions
# (fresh fetch on every call), just slower.
[[kv_namespaces]]
binding = "TRENDS_KV"
id = "e0e6345e84a54feb9b1f592e7cac43f9"

[[kv_namespaces]]
binding = "JUDGE_KV"
id = "8e994f5341a348418c3411f698e587bf"

# Workers AI — provides FLUX-Schnell (free tier: ~66 images/day) for visual previews.
# No setup needed; binding is automatic once `wrangler deploy` runs.
[ai]
binding = "AI"
